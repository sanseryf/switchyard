[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switchyard"
version = "0.3.0"
description = "Webhook router: signed ingest, dedupe, routing, reliable delivery and a self-explaining DLQ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
switchyard = "switchyard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/switchyard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/switchyard/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/switchyard"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yaml.*", "fastapi.*", "starlette.*", "httpx.*", "typer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["switchyard"]
branch = true
